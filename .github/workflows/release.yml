name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A prerelease suffix on the tag (v0.1.0-ci.1) is allowed so the
      # pipeline can be tested without bumping package.json.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION%%-*}" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
            artifact-glob: dist/*.dmg
          - os: windows-latest
            dist-script: dist:win
            artifact-glob: dist/*.exe
          - os: ubuntu-latest
            dist-script: dist:linux
            artifact-glob: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # No signing certs on CI (signing is deferred); stop electron-builder
      # from looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --publish never: electron-builder would otherwise try to publish to
      # GitHub itself when it detects a CI tag build; the release job below
      # owns publishing.
      - name: Build installer
        run: pnpm ${{ matrix.dist-script }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: installers/*
