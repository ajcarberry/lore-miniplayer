name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm claude:type-check

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:jest:coverage

      # The integration suite and live-server e2e download and run real
      # loreserver/lore binaries, so they need a runner with a matching release
      # asset and a display. Keep them macOS-only.
      - name: Resolve Lore binary version + triple
        if: runner.os == 'macOS'
        id: lore-bins
        run: |
          VERSION="$(node -p "require('./node_modules/@lore-vcs/sdk/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "triple=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"

      - name: Cache Lore binaries
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .lore-test-cache/lore-bins
          key: lore-bins-${{ steps.lore-bins.outputs.version }}-${{ steps.lore-bins.outputs.triple }}

      - name: Integration tests (real loreserver)
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm test:integration

      # Electron E2E runs headed; hosted macOS/Windows runners have a display,
      # Linux does not, so it stays fast-checks-only.
      - name: Build app for E2E
        if: runner.os != 'Linux'
        run: pnpm build

      # The hosted macOS runner's display is 1024x768 (fixed — no other modes),
      # and the menu bar + Dock leave a 677px work area, 3px short of the app's
      # 680px expanded window, so macOS clamps the morph and the geometry tests
      # fail. Auto-hiding the Dock frees ~744px of work area.
      - name: Auto-hide the Dock so the 680px window fits (macOS)
        if: runner.os == 'macOS'
        run: |
          defaults write com.apple.dock autohide -bool true
          killall Dock || true

      - name: Playwright E2E
        if: runner.os != 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec playwright test

      # Focus/blur and unfocused-dim assertions need a real OS-granted window
      # focus, which needs a visible window, so they're excluded from the
      # default project set (see playwright.config.ts) and run explicitly
      # here instead. They keep their existing self-skip if a runner's window
      # manager won't actually grant the window focus — expected, not a
      # failure.
      - name: Playwright E2E (electron-focus)
        if: runner.os != 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec playwright test --project=electron-focus

      # The HTML report is uploaded on success and failure alike, so every
      # run's report — traces and videos included when something failed — is
      # reviewable from the run page linked in the PR's checks. The
      # electron-focus run writes to its own folder (see the reporter config)
      # so the second invocation doesn't clobber the main report.
      - name: Upload Playwright HTML report
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            playwright-report-focus/

      # Harness server logs (tests/integration/harness/server.ts) live under
      # the OS temp dir and are normally deleted by the harness's own
      # stop()/afterAll cleanup, so this only catches the log on a crash that
      # skipped that cleanup, hence if-no-files-found: ignore.
      - name: Upload Playwright failure artifacts
        if: failure() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: |
            test-results/
            /tmp/lore-test-server-*/server.log
            /var/folders/**/lore-test-server-*/server.log
          if-no-files-found: ignore
